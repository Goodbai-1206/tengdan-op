<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>腾诞日行动</title>
<link rel="icon" type="image/png" href="images/logo_mark.png">
<link rel="apple-touch-icon" href="images/logo_mark.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <div id="touch"></div>
  <div id="joy" class="joy"><div id="joy-knob" class="knob"></div></div>

  <div id="hud" class="hidden">
    <div id="progress" aria-label="已收集物资"><svg class="hud-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M3.5 7.5h17v3h-17z"/><path d="M12 7.5V20"/><path d="M12 7.5c-2.6 0-4.2-1-4.2-2.4S9.6 3 12 7.5zM12 7.5c2.6 0 4.2-1 4.2-2.4S14.4 3 12 7.5z"/></svg><span class="pn">0/0</span></div>
    <button id="bag-btn" class="small-btn" aria-label="背包"><svg class="hud-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7.5V6.5a3 3 0 0 1 6 0v1"/><rect x="5" y="7.5" width="14" height="12.5" rx="4"/><path d="M9 14h6"/></svg></button>
    <button id="review-btn" class="small-btn">查看结算</button>
    <button id="search-btn" aria-label="搜索"><svg class="hud-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg></button>
    <div id="hint"><span class="h-long">左半屏按住移动 · 右半屏拖动转视角 · 准星对准柜子抽屉，走近搜索</span><span class="h-short">对准柜子抽屉，走近搜索</span></div>
  </div>

  <!-- 封面（样式在 style.css 的「封面」分区）。换背景只需替换 images/cover_bg.jpg -->
  <div id="title">
    <div class="cv-bg"><img class="cv-bg-img" id="cv-bg-img" src="images/cover_bg.jpg" alt="" draggable="false"></div>
    <div class="cv-shade"></div>
    <div class="cv-main">
      <div class="cv-logo"><img id="cv-logo-img" src="images/logo.webp" alt="腾诞日行动" draggable="false"><i class="cv-sheen"></i></div>
      <button id="start-btn" class="cv-btn is-loading" disabled style="--p:0%">
        <span class="cv-btn-face">
          <span class="cv-btn-fill"></span>
          <span class="cv-btn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19.2 12z"/></svg></span>
          <span class="cv-btn-label" id="start-label">加载中 0%</span>
        </span>
      </button>
      <div id="cv-msg"></div>
    </div>
    <div class="cv-foot">
      <span class="cv-tip">横屏体验更佳</span>
      <button id="snd-btn" class="cv-snd" aria-label="声音开关" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5z"/><path class="w" d="M15.6 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5z"/><path class="w" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script src="content.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
